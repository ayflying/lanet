org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# ---------------------------------------------------------------------------
# DCloud uni-app SDK（编译插件 module 必需，全部以 compileOnly 引入）
#
# HBuilderX 安装后自带这套 jar —— 它们是 uni-app 运行时的类文件，插件里的
# LanetVpnModule 要继承 io.dcloud.feature.uniapp.common.UniModule，没有它们
# 连编译都过不去。
#
# DCloud 官网的 Android 离线 SDK 只走百度云/和彩云网盘（无法自动下载），
# 但 HBuilderX 自带的这份足够编译：实测所需的 UniModule / AbsSDKInstance /
# UniJSCallback / UniJSMethod / WXModule 五件套齐全，签名与官方文档一致。
#
# 换成别的 HBuilderX 安装位置时改这一行即可（反斜杠在 .properties 里要转义，
# 或直接用正斜杠）。
# ---------------------------------------------------------------------------
dcloudSdkDir=D:/HBuilderX/plugins/uniapp-runextension/lib
