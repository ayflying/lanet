# =================================================================================
# Lanet 客户端容器编排（Linux 主机 / 需真实 TUN 联网时使用）。
# 镜像由 GitHub Actions 自动编译并推送（.github/workflows/docker.yml）。
#
#   启动：PVN_CTL_ADDR=http://ctl主机:8000 PVN_NAME=pc1 \
#         PVN_MODE=join PVN_INVITE=1234567890 \
#         docker compose -f deploy/docker-compose.agent.yml up -d
#
# 环境变量说明（经 compose 插值转为 pvn-agent 命令行参数）：
#   PVN_CTL_ADDR  控制面地址（必填，如 http://192.168.50.217:8000）
#   PVN_MODE      create=创建群组 / join=凭邀请加入（默认 join）
#   PVN_INVITE    join 模式的邀请码（必填）
#   PVN_NAME      节点名称（必填）
#   PVN_GROUP     create 模式的群组名称（默认 default）
#   PVN_TUN       TUN 网卡名（默认 pvn0）
#   PVN_MTU       TUN MTU（默认 1400）
# =================================================================================

services:
  agent:
    image: ghcr.io/ayflying/lanet-agent:latest
    container_name: lanet-agent
    restart: unless-stopped
    # TUN 网卡与 P2P 打洞需要的能力与设备。
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    network_mode: host
    environment:
      # 透传给应用内部日志/扩展使用；实际入网参数走下方 command。
      PVN_MODE: ${PVN_MODE:-join}
      PVN_NAME: ${PVN_NAME:-lanet-node}
    # pvn-agent 用 gcmd 声明式参数，容器内必须启用真实 TUN。
    command:
      - "-ctl"
      - "${PVN_CTL_ADDR:-http://127.0.0.1:8000}"
      - "-mode"
      - "${PVN_MODE:-join}"
      - "-invite"
      - "${PVN_INVITE:-}"
      - "-name"
      - "${PVN_NAME:-lanet-node}"
      - "-os"
      - "linux"
      - "-group"
      - "${PVN_GROUP:-default}"
      - "-tun"
      - "${PVN_TUN:-pvn0}"
      - "-mtu"
      - "${PVN_MTU:-1400}"
      - "-real-tun=true"
