# =================================================================================
# Lanet 服务端容器编排：控制面（ctl）+ P2P 中继（relay）。
# 镜像由 GitHub Actions 自动编译并推送（.github/workflows/docker.yml）。
#
#   启动：docker compose -f deploy/docker-compose.server.yml up -d
#   数据：./data 目录存放 ctl 的 SQLite 数据库（群组/成员/通告地址）
# =================================================================================

services:
  # 控制面：建群/入组/NetMap/中继目录 API。
  ctl:
    image: ghcr.io/ayflying/lanet-ctl:latest
    container_name: lanet-ctl
    restart: unless-stopped
    environment:
      # SQLite 数据库路径（容器内持久化目录）。
      PVN_CTL_DB: /data/lanet.db
      # 容器内监听地址。
      PVN_CTL_ADDR: ":8000"
    ports:
      - "8000:8000"
    volumes:
      # 命名卷：首次挂载自动继承镜像内 /data 属主（lanet），
      # 避免 bind mount 的 root 目录权限问题。
      - lanet-ctl-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # P2P 中继（libp2p Circuit Relay v2）：直连失败时兜底转发。
  relay:
    image: ghcr.io/ayflying/lanet-relay:latest
    container_name: lanet-relay
    restart: unless-stopped
    ports:
      - "4001:4001/tcp"
      - "4001:4001/udp"
    # 中继无 HTTP 健康端点，仅保证进程存活自动拉起。

volumes:
  lanet-ctl-data:
