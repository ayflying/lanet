# =================================================================================
# Lanet 容器镜像 CI：只构建官方 P2P 单程序节点 lanet-node，
# 同步推送到 ghcr.io/ayflying 与 docker.io/ayflying。
#
# 触发：push 到 main（含代码/Dockerfile/CI/VERSION/README 变更）、v* tag 或手动 workflow_dispatch。
# 标签策略：分支名 / 语义化版本 tag（v1.2.3 → 1.2.3, 1.2, 1）/ 根目录 VERSION
# 文件内容（如 0.2.1）/ latest。改代码先改 VERSION 再提交，镜像即带版本号。
# =================================================================================

name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "build/**"
      - "VERSION"
      - "README.md"
      - ".github/workflows/docker.yml"
      - ".github/workflows/stability.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
  DOCKERHUB_IMAGE_PREFIX: docker.io/ayflying

# 新提交取代旧提交，避免同一分支重复占用多架构构建资源。
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stability:
    uses: ./.github/workflows/stability.yml
  build:
    needs: stability
    name: Build node
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from VERSION file
        id: ver
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USER || 'ayflying' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_PREFIX }}/lanet-node
            ${{ env.DOCKERHUB_IMAGE_PREFIX }}/lanet-node
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/node.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 注入版本号：P2P 自更新与成员表版本列都依赖它（dev 版本号不可比）。
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=node
          cache-to: type=gha,scope=node,mode=max

  # 独立于 stability/build：说明同步失败不会阻止镜像构建或推送。
  dockerhub-description:
    name: Docker Hub description (lanet-node)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync Docker Hub description
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USER || 'ayflying' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ayflying/lanet-node
          short-description: Lanet encrypted P2P virtual LAN - lanet-node
          readme-filepath: ./build/dockerhub-README.md
