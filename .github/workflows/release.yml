# =================================================================================
# Lanet 发行包 CI：交叉编译全平台可执行文件并打包压缩，上传到 GitHub Release。
#
# 触发：push 到 main（代码/VERSION/打包脚本变更）、v* tag、手动 workflow_dispatch。
# 版本号：根目录 VERSION 文件（三段式，如 0.2.1）。改代码先改 VERSION 再提交。
#
# 产物（全部压缩，不直接上传 exe）：
#   lanet-{版本}-windows-amd64.zip    含 lanet.exe（单程序，客户端=服务端）+ wintun.dll + README
#   lanet-{版本}-linux-amd64.tar.gz   含 lanet
#   lanet-{版本}-linux-arm64.tar.gz   同上（arm64）
#   sha256sums.txt                    全部压缩包校验和
#
# 发行说明 = 改 VERSION 那次提交的 commit message（直接写改动内容，不留 compare 链接）。
# ⚠️ wintun.dll 不打入 exe（运行时从 exe 同目录或 System32 加载），
#    Windows 包必须附带与 GOARCH 匹配的 wintun.dll。
# =================================================================================

name: release

on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "build/**"
      - "packaging/**"
      - "VERSION"
      - ".github/workflows/release.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  WIN_TUN_VERSION: "0.14.1"

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
            pack: zip
          - goos: linux
            goarch: amd64
            ext: ""
            pack: tar.gz
          - goos: linux
            goarch: arm64
            ext: ""
            pack: tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Read version
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Build binaries
        shell: bash
        run: |
          DIR="dist/lanet-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "$DIR"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          # Windows 用 GUI 子系统：双击启动无黑色控制台窗口（托盘常驻，日志在 lanet.log）。
          if [ "${{ matrix.goos }}" = "windows" ]; then LDFLAGS="$LDFLAGS -H=windowsgui"; fi
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -trimpath -ldflags "$LDFLAGS" \
            -o "$DIR/lanet${{ matrix.ext }}" ./app/agent/cmd/pvn-node
          echo "$VERSION" > "$DIR/VERSION"
          cp packaging/release-README.txt "$DIR/README.txt"

      - name: Attach wintun.dll and README (windows)
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          curl -fsSL -o wintun.zip "https://www.wintun.net/builds/wintun-${WIN_TUN_VERSION}.zip"
          unzip -j wintun.zip "wintun/bin/amd64/wintun.dll" -d "dist/lanet-windows-amd64/"
          cp packaging/agent-windows-README.txt "dist/lanet-windows-amd64/README.txt"

      - name: Pack archive
        shell: bash
        run: |
          cd dist
          ARCHIVE="lanet-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.pack }}"
          if [ "${{ matrix.pack }}" = "zip" ]; then
            zip -r "$ARCHIVE" "lanet-${{ matrix.goos }}-${{ matrix.goarch }}"
          else
            tar -czf "$ARCHIVE" "lanet-${{ matrix.goos }}-${{ matrix.goarch }}"
          fi
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanet-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/lanet-*.zip
            dist/lanet-*.tar.gz
            dist/lanet-*.sha256
          retention-days: 30

  release:
    name: Attach to GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整历史定位「改 VERSION 的那次提交」

      - name: Read version
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      # 发行说明 = 改 VERSION 那次提交的 commit message（标题 + 详细改动列表），
      # 不用 GitHub 自动生成的 Full Changelog 链接。
      # 约定：版本提交的 message 必须写清本版改动，它就是发行说明。
      - name: Build release notes from version commit
        shell: bash
        run: |
          MSG=$(git log -1 --format=%B -- VERSION | tr -d '\r')
          TITLE=$(echo "$MSG" | head -1)
          BODY=$(echo "$MSG" | tail -n +2 | sed '/./,$!d')
          {
            echo "## ${TITLE}"
            echo
            echo "${BODY}"
            echo
            echo "---"
            echo "解压即用（Windows 以管理员身份运行，wintun.dll 保持与 lanet.exe 同目录）。"
            echo "完整性校验：\`sha256sum -c sha256sums.txt\`"
          } > release-notes.md
          echo "---- release-notes.md ----"
          cat release-notes.md

      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Merge checksums
        shell: bash
        run: |
          cd dist
          cat *.sha256 > sha256sums.txt
          rm -f *.sha256

      - name: Attach to GitHub Release (tag v${{ env.VERSION }})
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: |
            dist/lanet-*.zip
            dist/lanet-*.tar.gz
            dist/sha256sums.txt
          body_path: release-notes.md
