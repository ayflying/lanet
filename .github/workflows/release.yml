# =================================================================================
# Lanet 发行包 CI：交叉编译全平台可执行文件并打包压缩，上传到 GitHub Release。
#
# 触发：push 到 main（代码/VERSION/打包脚本变更）、v* tag、手动 workflow_dispatch。
# 版本号：根目录 VERSION 文件（三段式，如 0.2.1）。改代码先改 VERSION 再提交。
#
# 产物（全部压缩，不直接上传 exe）：
#   lanet-{版本}-windows-amd64.zip    含 lanet.exe（单程序，客户端=服务端）+ wintun.dll + README
#   lanet-{版本}-linux-amd64.tar.gz   含 lanet
#   lanet-{版本}-linux-arm64.tar.gz   同上（arm64）
#   sha256sums.txt                    全部压缩包校验和
#
# 发行说明 = 改 VERSION 那次提交的 commit message（直接写改动内容，不留 compare 链接）。
# ⚠️ wintun.dll 不打入 exe（运行时从 exe 同目录或 System32 加载），
#    Windows 包必须附带与 GOARCH 匹配的 wintun.dll。
# =================================================================================

name: release

on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "build/**"
      - "packaging/**"
      - "VERSION"
      - ".github/workflows/release.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  WIN_TUN_VERSION: "0.14.1"

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
            pack: zip
          - goos: linux
            goarch: amd64
            ext: ""
            pack: tar.gz
          - goos: linux
            goarch: arm64
            ext: ""
            pack: tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Read version
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Build binaries
        shell: bash
        run: |
          DIR="dist/lanet-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "$DIR"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          # Windows 用 GUI 子系统：双击启动无黑色控制台窗口（托盘常驻，日志在 lanet.log）。
          if [ "${{ matrix.goos }}" = "windows" ]; then LDFLAGS="$LDFLAGS -H=windowsgui"; fi
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -trimpath -ldflags "$LDFLAGS" \
            -o "$DIR/lanet${{ matrix.ext }}" ./app/agent/cmd/pvn-node
          echo "$VERSION" > "$DIR/VERSION"
          cp packaging/release-README.txt "$DIR/README.txt"

      # 发布签名：对裸二进制生成带 Ed25519 签名的版本清单分片。
      # 私钥在仓库 Secret SELFUPDATE_SIGNING_KEY（PEM PKCS#8），只在 CI 内短暂出现。
      # P2P 自更新以此清单为信任锚：节点内置公钥验签，≥3 成员清单一致才升级。
      # 未配置 Secret 时跳过（P2P 更新链路静默不生效，GitHub 更新路径不受影响）。
      # 注意：不能写成 if: secrets.X != '' —— if 条件里不允许 secrets 上下文，
      # 会触发 workflow 校验失败（整个流水线 0 job 启动即失败）。
      - name: Sign binary (P2P self-update manifest)
        shell: bash
        env:
          SELFUPDATE_SIGNING_KEY: ${{ secrets.SELFUPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$SELFUPDATE_SIGNING_KEY" ]; then
            echo "未配置 SELFUPDATE_SIGNING_KEY，跳过签名"
            exit 0
          fi
          go run ./cmd/sign-manifest \
            -version "${VERSION}" \
            -platform "${{ matrix.goos }}/${{ matrix.goarch }}" \
            -file "dist/lanet-${{ matrix.goos }}-${{ matrix.goarch }}/lanet${{ matrix.ext }}" \
            -out "dist/manifest-${{ matrix.goos }}-${{ matrix.goarch }}.json"
          # 分片同时放进发行包：解压即有分发凭证，升级后可立即成为 P2P 种子。
          cp "dist/manifest-${{ matrix.goos }}-${{ matrix.goarch }}.json" \
             "dist/lanet-${{ matrix.goos }}-${{ matrix.goarch }}/manifest.json"

      - name: Attach wintun.dll and README (windows)
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          curl -fsSL -o wintun.zip "https://www.wintun.net/builds/wintun-${WIN_TUN_VERSION}.zip"
          unzip -j wintun.zip "wintun/bin/amd64/wintun.dll" -d "dist/lanet-windows-amd64/"
          cp packaging/agent-windows-README.txt "dist/lanet-windows-amd64/README.txt"

      - name: Pack archive
        shell: bash
        run: |
          cd dist
          ARCHIVE="lanet-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.pack }}"
          if [ "${{ matrix.pack }}" = "zip" ]; then
            zip -r "$ARCHIVE" "lanet-${{ matrix.goos }}-${{ matrix.goarch }}"
          else
            tar -czf "$ARCHIVE" "lanet-${{ matrix.goos }}-${{ matrix.goarch }}"
          fi
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanet-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/lanet-*.zip
            dist/lanet-*.tar.gz
            dist/lanet-*.sha256
            dist/manifest-*.json
          retention-days: 30

  release:
    name: Attach to GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整历史定位「改 VERSION 的那次提交」

      - name: Read version
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      # 发行说明 = 改 VERSION 那次提交的 commit message（标题 + 详细改动列表），
      # 不用 GitHub 自动生成的 Full Changelog 链接。
      # 约定：版本提交的 message 必须写清本版改动，它就是发行说明。
      - name: Build release notes from version commit
        shell: bash
        run: |
          MSG=$(git log -1 --format=%B -- VERSION | tr -d '\r')
          TITLE=$(echo "$MSG" | head -1)
          BODY=$(echo "$MSG" | tail -n +2 | sed '/./,$!d')
          {
            echo "## ${TITLE}"
            echo
            echo "${BODY}"
            echo
            echo "---"
            echo "解压即用（Windows 双击运行，UAC 弹窗点「是」即可；wintun.dll 保持与 lanet.exe 同目录）。"
            echo "完整性校验：\`sha256sum -c sha256sums.txt\`"
          } > release-notes.md
          echo "---- release-notes.md ----"
          cat release-notes.md

      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Merge checksums
        shell: bash
        run: |
          cd dist
          cat *.sha256 > sha256sums.txt
          rm -f *.sha256

      # 合并各平台签名分片为全网统一清单（P2P 自更新信任锚）。
      # 无分片（未配置签名密钥）时脚本内自动跳过；不用 if: secrets（上下文不可用）。
      - name: Merge update manifests
        shell: bash
        run: |
          cd dist
          if ls manifest-*.json >/dev/null 2>&1; then
            # 分片结构为单对象 artifact 条目，直接拼装。
            echo "{\"version\":\"${{ env.VERSION }}\",\"artifacts\":[" > manifest.json
            first=1
            for f in manifest-*.json; do
              if [ $first -eq 0 ]; then echo "," >> manifest.json; fi
              cat "$f" >> manifest.json
              first=0
            done
            echo "]}" >> manifest.json
            jq . manifest.json > /dev/null   # 语法校验，失败即终止
            rm -f manifest-*.json
            echo "manifest.json:"; cat manifest.json
          else
            echo "无签名分片（未配置 SELFUPDATE_SIGNING_KEY），跳过"
          fi

      - name: Attach to GitHub Release (tag v${{ env.VERSION }})
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: |
            dist/lanet-*.zip
            dist/lanet-*.tar.gz
            dist/sha256sums.txt
            dist/manifest.json
          body_path: release-notes.md
