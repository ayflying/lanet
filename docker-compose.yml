# =================================================================================
# Lanet 公网节点容器编排（仅 Linux；Windows 用发行包 lanet.exe，与此文件无关）。
# 用途：部署在一台有公网 IP 的 VPS 上，充当整个网络的引导 + 中继节点，
# 让各自 NAT 后的成员稳定互通（直连优先，打洞失败经本节点中继转发）。
# 镜像由 GitHub Actions 自动构建推送：ghcr.io/ayflying/lanet-node（linux/amd64+arm64）。
#
#   启动：改好下方 environment 后
#         docker compose up -d
#   防火墙放行：8900/tcp（控制台）+ 4001/tcp + 4001/udp（P2P 直连与打洞）
#
# 配置直接改本文件的 environment 段（保存后 docker compose up -d 重建生效）：
#   LANET_NAME              节点名称（成员表中的虚拟域名）
#   LANET_NETWORK_KEY       网络密钥；与要服务的群组保持一致（留空 = 公共网络）
#   LANET_CONSOLE           控制台监听地址：0.0.0.0:8900 = 允许外网访问；
#                           127.0.0.1:8900 = 仅本机（用 SSH 隧道查看，更安全）
#   LANET_CONSOLE_PASSWORD  控制台访问密码；LANET_CONSOLE 允许外网访问时务必设置！
#   LANET_BOOTSTRAP         引导方式（默认 public = 公共 DHT）
#   LANET_LISTEN            P2P 监听地址（默认随机端口；这里固定 4001 便于防火墙放行）
# =================================================================================

services:
  node:
    image: ghcr.io/ayflying/lanet-node:latest
    container_name: lanet-node
    restart: unless-stopped
    environment:
      LANET_NAME: vps-node
      LANET_NETWORK_KEY: lanet-test
      # ---- 控制台：能否外网访问 + 访问密码 ----
      LANET_CONSOLE: 0.0.0.0:8900
      LANET_CONSOLE_PASSWORD: "请改成强密码"
      LANET_BOOTSTRAP: public
      # ---- 固定 P2P 端口，防火墙只需放行 4001/tcp + 4001/udp ----
      LANET_LISTEN: "/ip4/0.0.0.0/tcp/4001,/ip4/0.0.0.0/udp/4001/quic-v1"
    ports:
      - "8900:8900"      # Web 控制台（仅当 LANET_CONSOLE=0.0.0.0:8900 时对外有意义）
      - "4001:4001/tcp"  # P2P 直连与中继流量
      - "4001:4001/udp"  # QUIC / 打洞
    volumes:
      # 命名卷：node.key / lanet.json / state.json / lanet.log 全部落在这里，
      # 首次挂载自动继承镜像内 /data 属主（lanet），重建容器身份不变。
      - lanet-node-data:/data
    # ---- TUN 虚拟网卡（0.4.0+，按需二选一）----
    # 0.4.0 起节点默认尝试创建 TUN（IP 层互通：ping / 任意端口直达虚拟 IP）。
    # 容器默认非 root 且无 /dev/net/tun，创建会失败并自动降级为纯应用层
    # （Dial / 端口转发不受影响），每次启动日志记一条降级原因。
    # ① 引导/中继节点不需要 TUN，建议显式关闭保持日志干净（取消下行注释）：
    # command: ["-tun", "false"]
    # ② 要让容器节点真正启用 TUN（其他成员需 ping 通它的虚拟 IP）时，
    #    改为 root 运行并授予网卡权限（同时要求宿主机已加载 tun 模块）：
    # user: "0:0"
    # cap_add:
    #   - NET_ADMIN
    # devices:
    #   - /dev/net/tun

volumes:
  lanet-node-data:
